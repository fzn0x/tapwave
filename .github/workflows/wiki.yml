name: Wiki

# The wiki is written in docs/wiki/ so changes are reviewed like code; this copies it to the
# GitHub wiki after every change on main.
on:
  push:
    branches: [main]
    paths:
      - docs/wiki/**
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Publish docs/wiki
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Copy the pages to the wiki repository
        env:
          TOKEN: ${{ github.token }}
        run: |
          wiki="$RUNNER_TEMP/wiki"
          # GitHub creates the wiki repository only when its first page is saved in the browser.
          if ! git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki"; then
            echo "::warning::The wiki has no pages yet. Save any first page once at https://github.com/${GITHUB_REPOSITORY}/wiki, then run this workflow again."
            exit 0
          fi
          find "$wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp docs/wiki/*.md "$wiki/"
          # In the repository, pages link to each other as Page.md; the wiki wants Page.
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g' "$wiki"/*.md
          cd "$wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "docs: sync from ${GITHUB_SHA::7}"
          git push
