; Tapwave firmware. ARCHITECTURE.md section 3 explains the environments and the flash layout.
;
;   pio run -e esp32-4mb                 build the firmware
;   pio run -e esp32-4mb -t buildfs      build the web UI filesystem image
;   pio run -e esp32-4mb -t upload       flash the firmware over USB
;   pio run -e esp32-4mb -t uploadfs     flash the web UI over USB
;   pio test -e native                   run the unit tests on this computer

[platformio]
default_envs = esp32-4mb
; Generated by scripts/build_ui.py from ui/ before every device build.
data_dir = .pio/ui-data

[tapwave]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
lib_deps =
    bblanchon/ArduinoJson@7.4.3

[esp32_common]
platform = ${tapwave.platform}
framework = arduino
lib_deps = ${tapwave.lib_deps}
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/pio_pre.py
build_unflags =
    -std=gnu++11
    -std=gnu++17
    -std=gnu++2a
    -std=gnu++2b
build_flags =
    -std=gnu++23
    -Wall
    -Wextra
    -Wno-missing-field-initializers
    -DCORE_DEBUG_LEVEL=3

; ESP32 builds use the WROVER flags: the PSRAM cache workaround is harmless on boards without PSRAM.
[esp32_classic]
extends = esp32_common
board = esp-wrover-kit
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw

[env:esp32-4mb]
extends = esp32_classic
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions/4mb.csv

[env:esp32-8mb]
extends = esp32_classic
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions/8mb.csv

[env:esp32-16mb]
extends = esp32_classic
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/16mb.csv

; Secondary target (milestone 4). Builds in CI from the start.
[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions/16mb.csv
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Unit tests on the host: core/ and drivers/nfc/common/ only (ARCHITECTURE.md section 4).
[env:native]
platform = native
test_framework = doctest
test_build_src = yes
build_src_filter =
    -<*>
    +<core/>
    +<drivers/nfc/common/>
build_flags =
    -std=c++23
    -Wall
    -Wextra
    -Wpedantic
    -Werror
    -Isrc
    -Itest/support
    -DTAPWAVE_NATIVE
    -DTAPWAVE_VERSION=\"0.0.0-test\"
    -DTAPWAVE_ENV=\"native\"
lib_deps = ${tapwave.lib_deps}
lib_compat_mode = off

; Same tests with AddressSanitizer and UBSan. Needs GCC or Clang on Linux or macOS.
[env:native-asan]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
extra_scripts = post:scripts/pio_asan.py
